# Render Blueprint — deploy del backend con un click.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: agentui-server
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false # se setea manualmente en el dashboard (secreto)
      - key: MONGODB_URI
        sync: false # MongoDB Atlas free tier (secreto)
      - key: CLIENT_ORIGIN
        value: "*" # CORS abierto al inicio; se restringe a la URL de Vercel al final
